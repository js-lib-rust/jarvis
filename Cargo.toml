[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }
lazy_static = "1.4"
chrono = "0.4.20-rc.1"
regex = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }

tokio-stream = "0.1"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
askama = "0.12"
mongodb = "2.8"
bson = "2.4"
